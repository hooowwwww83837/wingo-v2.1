name: Collect Wingo Rounds

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run collector
        run: node collect.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wingo_data.json
          if git diff --staged --quiet; then
            echo "⚠ No changes to commit"
          else
            git commit -m "Update rounds [skip ci]"
            git pull --rebase origin main
            git push
            echo "✓ Pushed successfully"
          fi
